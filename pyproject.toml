[project]
name = "slatev2"
version = "0.1.0"
description = "SLATE v2 — a tile-based roguelike (engine + content editor)."
requires-python = ">=3.11"
dependencies = [
    "simpleeval>=1.0.0",
    # Added by 07-input-renderer-audio.md: pygame-ce is a hard runtime
    # dependency of engine/input, engine/render, engine/audio (and will be
    # for 08-ui-runtime.md/09-animation-vfx.md too). pyproject.toml is
    # nominally 00-foundation-core.md's exclusive file (CONTRACTS.md §1),
    # but there is no other documented extension point for a Wave-1
    # component's third-party dependency, and "pytest green" (CONTRACTS.md
    # §9/component doc §8) is not achievable without it -- flagged in this
    # component's PR as a CONTRACTS.md ownership gap (dependencies arguably
    # deserve the same "shared, additive-only" treatment as
    # _COMPONENT_REGISTRY) rather than resolved by skipping the dependency.
    "pygame-ce>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*"]
