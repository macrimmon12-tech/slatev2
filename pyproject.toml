[project]
name = "slatev2"
version = "0.1.0"
description = "SLATE v2 — a tile-based roguelike (engine + content editor)."
requires-python = ">=3.11"
dependencies = [
    "simpleeval>=1.0.0",
    # Added by 07-input-renderer-audio.md: pygame-ce is a hard runtime
    # dependency of engine/input, engine/render, engine/audio (and 08's
    # ui_runtime/09's anim_system, both of which independently added the
    # same line before landing on this shared dependency instead).
    # pyproject.toml is nominally 00-foundation-core.md's exclusive file
    # (CONTRACTS.md §1), but there is no other documented extension point
    # for a Wave-1 component's third-party dependency, and "pytest green"
    # (CONTRACTS.md §9/component doc §8) is not achievable without it --
    # flagged in each component's PR as a CONTRACTS.md ownership gap
    # (dependencies arguably deserve the same "shared, additive-only"
    # treatment as _COMPONENT_REGISTRY) rather than resolved by skipping
    # the dependency.
    "pygame-ce>=2.5.0",
    # Added by 10-lua-scripting-layer.md: `lupa` (embedded Lua via
    # LuaRuntime) is a hard runtime dependency of engine/lua/lua_host.py,
    # and engine/core/save.py imports LuaFloorStateComponent/
    # LuaCampaignStateComponent from it for _COMPONENT_REGISTRY. Same
    # ownership-gap flag as pygame-ce above: pyproject.toml is nominally
    # foundation-owned, but there's no other extension point for a Wave-1
    # component's third-party dependency.
    "lupa>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*"]
